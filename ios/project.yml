name: GarminHub
options:
  bundleIdPrefix: com.beriscope
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ZZ2RVM493V
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  GarminHub:
    type: application
    platform: iOS
    sources:
      - path: GarminHub
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: GarminHub/GarminHub.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.beriscope.garminhub
        PRODUCT_NAME: Garmin Hub
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Garmin Hub
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        INFOPLIST_KEY_NSHealthShareUsageDescription: Garmin Hub reads Apple Watch workouts to keep your training history complete.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
  GarminHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: GarminHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beriscope.garminhub.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Garmin Hub.app/Garmin Hub"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  GarminHub:
    build:
      targets:
        GarminHub: all
        GarminHubTests: [test]
    test:
      targets:
        - GarminHubTests
