name: garmin-hub

services:
  garth-init:
    image: alpine:3.21
    command: [sh, -c, "chown -R 65532:65532 /garth"]
    volumes:
      - garth-cache:/garth
    restart: "no"

  postgres:
    image: postgres:17-bookworm
    container_name: garmin-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: garminhub
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      GARMINHUB_RO_PASSWORD: ${GARMINHUB_RO_PASSWORD:?set GARMINHUB_RO_PASSWORD}
      GARMINHUB_RW_PASSWORD: ${GARMINHUB_RW_PASSWORD:?set GARMINHUB_RW_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-garminhub.sh:ro
      - ../../db/schema.pg.sql:/schema/schema.pg.sql:ro
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d garminhub"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    build:
      context: ../..
      dockerfile: deploy/droplet/Dockerfile
    container_name: garmin-hub
    restart: unless-stopped
    depends_on:
      garth-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      API_SECRET: ${API_SECRET:?set API_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY}
      GARMIN_EMAIL: ${GARMIN_EMAIL:?set GARMIN_EMAIL}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD:?set GARMIN_PASSWORD}
      DATABASE_URL_RO: postgresql://garminhub_ro:${GARMINHUB_RO_PASSWORD}@postgres:5432/garminhub
      DATABASE_URL_RW: postgresql://garminhub_rw:${GARMINHUB_RW_PASSWORD}@postgres:5432/garminhub
      DATABASE_URL: postgresql://garminhub_rw:${GARMINHUB_RW_PASSWORD}@postgres:5432/garminhub
      PG_ADMIN_URL: postgresql://postgres:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/garminhub
      TOKENSTORE: /var/lib/garmin-hub/garth
      INGEST_PYTHON: /usr/local/bin/python3.13
      JOB_STATUS_DIR: /run/garmin-hub-status
      BACKUP_DIR: /var/lib/garmin-hub/backups
    volumes:
      - garth-cache:/var/lib/garmin-hub/garth
      - ./job-status:/run/garmin-hub-status:ro
      - ./backups:/var/lib/garmin-hub/backups:ro
    networks: [private, caddy]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health',{headers:{'X-Api-Key':process.env.API_SECRET}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

volumes:
  postgres-data:
    name: garmin-hub-postgres-data
  garth-cache:
    name: garmin-hub-garth-cache

networks:
  private:
  caddy:
    external: true
    name: connect-remote_default
